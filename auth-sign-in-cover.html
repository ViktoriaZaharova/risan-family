	<title>Авторизация</title>

	<link rel="canonical" href="auth-sign-in-cover.html" />
	<link rel="shortcut icon" href="img/favicon.ico">

<body>
	<div class="authorization-page w-100">
		<div class="container-fluid p-0">
			<div class="row g-0">
				<div class="col-xl-6 d-none d-xl-flex">
					<div class="auth-full-page position-relative auth-full-page__left">
						<img src="img/photos/authorization-bg.jpg" class="auth-bg" alt="Unsplash">
						<div class="auth-quote">
							<div class="lion-icon"><img src="img/lion-icon.png" alt=""></div>
							<a href="#" class="auth-full-page-logo">
								<img src="img/logo-2.svg" alt="">
								<span>Внутрикорпоративная
									платформа</span>
							</a>
						</div>
					</div>
				</div>
				<div class="col-xl-6">
					<div class="auth-full-page d-flex p-4 p-xl-5 auth-full-page__right">
						<div class="d-flex flex-column w-100 h-100">
							<div class="auth-form">

								<div class="text-center">
									<h1 class="h2">Добро пожаловать!</h1>
									<p class="lead">
										Авторизируйтесь для входа
									</p>
								</div>

								<div class="mb-3">
									<form>
										<div class="mb-3">
											<input class="form-control form-control-lg" type="text" name="phone"
												placeholder="Введите телефон" />
										</div>
										<div class="mb-3">
											<input class="form-control form-control-lg mb-1" type="password" name="password"
												placeholder="Введите пароль" />
											<small>
												<a href='auth-reset-password.html'>Забыли пароль?</a>
											</small>
										</div>

										<div class="d-grid gap-2 mt-3">
											<a class='btn btn-lg btn-primary' href='dashboard-default.html'>Войти</a>
										</div>
									</form>
								</div>

								<div class="text-center">
									Еще нет аккаунта? <a href='auth-sign-up-cover.html'>Зарегистрироваться</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="js/app.js"></script>

</body>

</html>
